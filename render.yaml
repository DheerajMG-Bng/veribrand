services:
  - type: web
    name: veribrand
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_PRIMARY
        sync: false
      - key: GROQ_MODEL_FALLBACK
        sync: false
      - key: GROQ_MODEL_THIRD
        sync: false
